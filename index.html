<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animated short preview</title>
<style>
body{margin:0;background:#241726;color:#faf8f1;font:16px system-ui;display:grid;justify-items:center}
#screen{position:relative;height:85vh;aspect-ratio:9/16;background:#cfe3f2}
#screen canvas{position:absolute;width:100%;height:100%}
footer{padding:16px;display:flex;gap:12px;align-items:center}input{width:40vw}button{padding:6px 14px}
#status{max-width:600px;white-space:pre-wrap}
</style>
<div id="screen"></div>
<footer><button id="play">Play</button><input id="frame" type="range" min="0" value="0"><output id="time">0</output></footer>
<p id="status">Loading scene…</p>
<script type="module" src="/templates/bridge/player.ts"></script>
</html>
