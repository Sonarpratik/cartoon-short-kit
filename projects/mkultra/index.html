<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MKUltra · scene review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#141c25;color:#f1eee5;font:15px system-ui;display:grid;justify-items:center;gap:12px;padding:20px}
